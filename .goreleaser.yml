version: 2
project_name: mimixbox
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
    - go generate ./...
    # Dependency license texts into third_party_licenses/linux (needs
    # go-licenses v2; the release workflow installs it).
    - ./scripts/third_party_licenses.sh
builds:
  - main: ./cmd/mimixbox
    ldflags:
      - -s -w
      - -X github.com/nao1215/mimixbox/internal/version.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Wrap the contents in a single directory and bundle the self-contained
    # installer so `tar xf ...; cd ...; sudo ./installer.sh` works from a plain
    # extracted archive (GitHub issue #267).
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      # License texts of the linked dependencies, written by the before hook
      # above. installer.sh installs them into /usr/share/doc/mimixbox.
      - src: "third_party_licenses/{{ .Os }}/**/*"
        dst: THIRD_PARTY_LICENSES
      - src: scripts/installer.sh
        strip_parent: true
        info:
          mode: 0755
      - src: scripts/libshell.sh
        strip_parent: true
checksum:
  name_template: "checksums.txt"
# Software Bill of Materials (SPDX, generated by syft) for every release
# archive. The SBOMs are listed in checksums.txt, so the cosign signature
# below covers them too.
sboms:
  - artifacts: archive
# Keyless artifact signing with cosign. Signing the checksums file transitively
# covers every published artifact.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
nfpms:
  - maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: MimixBox - mimic BusyBox on Linux
    homepage: https://github.com/nao1215/mimixbox
    license: Apache-2.0 license
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/mimixbox/LICENSE
      - src: ./third_party_licenses/linux
        dst: /usr/share/doc/mimixbox/THIRD_PARTY_LICENSES
        type: tree
