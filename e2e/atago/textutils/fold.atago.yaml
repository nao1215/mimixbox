# Migrated from mimixbox's ShellSpec test/it/spec/fold_spec.sh (+ textutils/fold_test.sh).
version: "1"

suite:
  name: mimixbox fold

scenarios:
  - name: wraps lines to the given width
    steps:
      - run:
          shell: true
          command: printf 'abcdefgh\n' | fold -w 3
      - assert:
          exit_code: 0
          stdout:
            equals: |
              abc
              def
              gh

  # GNU fold writes no newline it did not read. The byte count shows what
  # equals cannot: "abc", a newline and "de" are six bytes.
  - name: ends a last line without a newline without one
    steps:
      - run:
          shell: true
          command: printf 'abcde' | fold -w 3 | wc -c
      - assert:
          exit_code: 0
          stdout:
            equals: "6"
