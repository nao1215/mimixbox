name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GoReleaser creates the GitHub release and uploads the archives.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        # "stable", not go-version-file: go.mod. go.mod declares the oldest Go a
        # user may build MimixBox from; the binaries we ship should carry the
        # newest runtime and security fixes instead. The unit-test workflow is
        # where the go.mod floor is actually exercised.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - name: Generate dependency licenses
        # Produce the licenses/ directory bundled into the release archives.
        # Uses the same invocation as the Makefile "licenses" target so local
        # and release output stay in sync. The --ignore prefixes skip a few
        # transitive deps whose license files go-licenses cannot auto-classify
        # (freetype uses a non-standard file name; modernc.org/mathutil lacks a
        # recognized one), which would otherwise abort the release.
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses save ./cmd/mimixbox --force --save_path "licenses/" \
            --ignore github.com/golang/freetype \
            --ignore modernc.org/mathutil
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2.16"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release archives bundle every installer-required file
        run: scripts/check_release_archive.sh dist
