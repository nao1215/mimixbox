name: Generate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Ensures the auto-generated applet registry and README command list stay in
# sync with the source tree. A drift between `make generate` output and the
# committed files fails this job so it cannot be merged silently.
jobs:
  generate:
    name: generate-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Regenerate code and command list
        run: make generate

      - name: Verify generated artifacts are up to date
        run: git diff --exit-code
