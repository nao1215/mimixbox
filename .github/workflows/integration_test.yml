name: IntegrationTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Install atago
        uses: nao1215/setup-atago@7cae89595fcbba334db0fe16fc9a24ed5b0a3fea # v0.1.2
        with:
          version: v0.23.0

      # `make it` (e2e) builds MimixBox and stages its applets in an isolated
      # PATH directory itself, so the workflow and the local target exercise
      # the exact same hermetic environment.
      - name: IntegrationTest
        run: make it
