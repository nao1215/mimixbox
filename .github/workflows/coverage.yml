name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (unit + e2e)
    runs-on: ubuntu-latest
    # octocov comments on the pull request and keeps its report in an artifact
    # datastore; everything else only reads the checkout.
    permissions:
      contents: read
      actions: write
      pull-requests: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      # The E2E half of `make coverage` runs the atago suite against a
      # coverage-instrumented mimixbox. atago is the runner; install it with the
      # same pinned action ref the integration_test workflow uses.
      - name: Install atago
        uses: nao1215/setup-atago@5c563dcd9d85e114f8abe8bbdcd058e51de09efb # v0.1.3
        with:
          version: v0.25.0

      # Combines unit-test coverage with self-hosted E2E coverage (the E2E suite
      # runs a `go build -cover` mimixbox and collects covdata via GOCOVERDIR),
      # then merges both into cover.out.
      - name: Run combined unit + E2E coverage
        run: make coverage

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .octocov.yml
