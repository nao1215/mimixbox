name: UnitTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The matrix is the floor and the ceiling of the supported Go range. The floor
  # is the lowest Go that builds MimixBox without source changes (it is what
  # go.mod declares); running it here is the only place that claim is checked.
  # The ceiling catches new vet checks and runtime behavior changes early.
  # Every other job uses "stable" on purpose - go.mod declares the floor users
  # may build from, not the toolchain this repo's CI should ship artifacts with.
  unit-test:
    name: Unit test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: UnitTest
        run: make ut

  unit-test-race:
    name: Unit test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Prepare test fixtures
        run: make pre_ut

      - name: Run tests with the race detector
        run: go test -race ./...
