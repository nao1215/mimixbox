name: Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# mimixbox is measured end to end with himorime, from bench/himorime.yaml.
#
# On a pull request, `himorime ci` checks the base of the pull request out
# into a temporary worktree, builds it and the head with the same Go, and
# measures both in interleaved rounds on this runner, so a noisy neighbour
# slows both revisions instead of one. The job fails when the head is slower,
# uses more CPU time or more memory than the base beyond the tolerance of the
# suite with 95% confidence; a difference too close to call is inconclusive
# and does not fail it. The comparison is written to the job summary.
#
# Started by hand, the job measures the ref it runs on without comparing.
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # setup-himorime (v0.2.0 and later) comments on a same-repository pull
    # request when the comparison regresses, is inconclusive or skips a
    # check; its post step fails without this.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit must exist locally for the temporary worktree.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: nao1215/setup-himorime@05b4d293796e34a46c59f1363e15841a18e83e92 # v0.2.1
        with:
          version: v0.6.1
      - name: Compare the base with the head
        if: github.event_name == 'pull_request'
        run: himorime ci --output "$RUNNER_TEMP/himorime.json" --format json bench
      - name: Measure
        if: github.event_name != 'pull_request'
        run: himorime run --output "$RUNNER_TEMP/himorime.json" --format json --summary "$GITHUB_STEP_SUMMARY" bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: himorime-report
          path: ${{ runner.temp }}/himorime.json
          retention-days: 7
